name: api

on:
  pull_request:
    paths: ["api/**", ".github/workflows/api.yml"]
  push:
    branches: [main]
    paths: ["api/**", ".github/workflows/api.yml"]

defaults:
  run:
    working-directory: api

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet build Portfolio.slnx -warnaserror
      - run: dotnet test Portfolio.slnx --no-build
