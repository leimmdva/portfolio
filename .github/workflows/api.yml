name: api

on:
  pull_request:
    paths: ["api/**", ".github/workflows/api.yml"]
  push:
    branches: [main]
    paths: ["api/**", ".github/workflows/api.yml"]

# The jobs only read the code.
permissions:
  contents: read

defaults:
  run:
    working-directory: api

jobs:
  check:
    runs-on: ubuntu-latest
    # The tests create and drop their own databases on this server.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES: Host=localhost;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet build Portfolio.slnx -warnaserror
      - run: dotnet test Portfolio.slnx --no-build
