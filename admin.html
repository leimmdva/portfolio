<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel — Leyla</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<!-- ============ LOGIN SCREEN ============ -->
<div id="login-screen" class="login-screen">
  <div class="login-card">
    <div class="logo" style="font-size:28px;margin-bottom:6px;">Leyla <span>+</span></div>
    <p style="color:var(--text-faint);font-size:13px;margin-bottom:26px;">Welcome to the admin panel</p>
    <div class="field">
      <label for="login-email">Email</label>
      <input id="login-email" type="email" placeholder="hello@leyla.dev">
    </div>
    <div class="field">
      <label for="login-password">Password</label>
      <input id="login-password" type="password" placeholder="••••••••">
    </div>
    <button id="login-btn" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:6px;">Log in →</button>
    <div id="login-error" class="form-status error" style="margin-top:14px;"></div>
  </div>
</div>

<!-- ============ DASHBOARD ============ -->
<div id="dashboard" class="dashboard hidden">

  <aside class="admin-sidebar">
    <div class="logo" style="margin-bottom:36px;">Leyla <span>+</span></div>
    <nav class="admin-nav">
      <button class="admin-tab-btn active" data-tab="posts">✎ Posts</button>
      <button class="admin-tab-btn" data-tab="notes">✦ Notes</button>
      <button class="admin-tab-btn" data-tab="projects">▣ Projects</button>
      <button class="admin-tab-btn" data-tab="messages">✉ Messages <span id="msg-badge" class="badge hidden">0</span></button>
    </nav>
    <div class="sidebar-bottom">
      <a href="index.html" target="_blank" class="admin-view-site">View site ↗</a>
      <button id="logout-btn" class="btn btn-outline" style="width:100%;justify-content:center;">Log out</button>
    </div>
  </aside>

  <main class="admin-main">

    <!-- ===== POSTS ===== -->
    <section id="tab-posts" class="admin-tab-panel">
      <div class="admin-panel-head">
        <h2>Posts</h2>
        <button id="new-post-btn" class="btn btn-primary">+ New post</button>
      </div>
      <div id="posts-table" class="admin-list"></div>

      <div id="post-form-panel" class="admin-form-panel hidden">
        <h3 id="post-form-title">New post</h3>
        <input type="hidden" id="post-id">
        <div class="field"><label>Title</label><input id="post-title" type="text" placeholder="Post title"></div>
        <div class="row-2">
          <div class="field">
            <label>Category</label>
            <select id="post-tag">
              <option>Life</option><option>Technology</option><option>Thoughts</option><option>Projects</option>
            </select>
          </div>
          <div class="field"><label>Read time</label><input id="post-readtime" type="text" placeholder="4 min"></div>
        </div>
        <div class="field"><label>Excerpt</label><input id="post-excerpt" type="text" placeholder="Short summary shown on the card"></div>
        <div class="field"><label>Cover image URL</label><input id="post-cover" type="text" placeholder="https://..."></div>
        <div class="field"><label>Content</label><textarea id="post-content" rows="10" placeholder="Separate paragraphs with a blank line"></textarea></div>
        <div class="field"><label>Date</label><input id="post-date" type="date"></div>
        <div class="admin-form-actions">
          <button id="save-post-btn" class="btn btn-primary">Save</button>
          <button id="cancel-post-btn" class="btn btn-outline">Cancel</button>
        </div>
      </div>
    </section>

    <!-- ===== NOTES ===== -->
    <section id="tab-notes" class="admin-tab-panel hidden">
      <div class="admin-panel-head">
        <h2>Notes</h2>
        <button id="new-note-btn" class="btn btn-primary">+ New note</button>
      </div>
      <div id="notes-table" class="admin-list"></div>

      <div id="note-form-panel" class="admin-form-panel hidden">
        <h3 id="note-form-title">New note</h3>
        <input type="hidden" id="note-id">
        <div class="field"><label>Note</label><textarea id="note-title" rows="2" placeholder="A short thought..."></textarea></div>
        <div class="field"><label>Extra note (optional)</label><input id="note-excerpt" type="text"></div>
        <div class="field"><label>Date</label><input id="note-date" type="date"></div>
        <div class="admin-form-actions">
          <button id="save-note-btn" class="btn btn-primary">Save</button>
          <button id="cancel-note-btn" class="btn btn-outline">Cancel</button>
        </div>
      </div>
    </section>

    <!-- ===== PROJECTS ===== -->
    <section id="tab-projects" class="admin-tab-panel hidden">
      <div class="admin-panel-head">
        <h2>Projects</h2>
        <button id="new-project-btn" class="btn btn-primary">+ New project</button>
      </div>
      <div id="projects-table" class="admin-list"></div>

      <div id="project-form-panel" class="admin-form-panel hidden">
        <h3 id="project-form-title">New project</h3>
        <input type="hidden" id="project-id">
        <div class="field"><label>Title</label><input id="project-title" type="text"></div>
        <div class="row-2">
          <div class="field"><label>Category</label><input id="project-tag" type="text" placeholder="Mobile App"></div>
          <div class="field"><label>Image URL</label><input id="project-image" type="text" placeholder="https://..."></div>
        </div>
        <div class="field"><label>Description</label><textarea id="project-description" rows="3"></textarea></div>
        <div class="field"><label>Technologies (comma-separated)</label><input id="project-stack" type="text" placeholder="Flutter, Firebase, Riverpod"></div>
        <div class="row-2">
          <div class="field"><label>Live preview URL</label><input id="project-live" type="text" placeholder="https://..."></div>
          <div class="field"><label>Source code URL</label><input id="project-repo" type="text" placeholder="https://github.com/..."></div>
        </div>
        <div class="admin-form-actions">
          <button id="save-project-btn" class="btn btn-primary">Save</button>
          <button id="cancel-project-btn" class="btn btn-outline">Cancel</button>
        </div>
      </div>
    </section>

    <!-- ===== MESSAGES ===== -->
    <section id="tab-messages" class="admin-tab-panel hidden">
      <div class="admin-panel-head">
        <h2>Contact messages</h2>
      </div>
      <div id="messages-list" class="admin-list"></div>
    </section>

  </main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/utils.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
